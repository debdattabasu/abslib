[package]
name = "abslib"
version = "0.2.1"
edition = "2021"
description = "Reusable async networking primitives for single-task protocol drivers: egress backpressure, per-kind concurrency ceilings and rate pacing, and a shared refresh/single-flight registry"
license = "MIT OR Apache-2.0"
repository = "https://github.com/debdattabasu/abslib"
keywords = ["tokio", "backpressure", "networking", "async"]
categories = ["asynchronous", "network-programming"]
readme = "README.md"
# Repo-maintenance files, not useful to a consumer of the crate.
exclude = ["CLAUDE.md", ".gitignore"]

[dependencies]
# `sync` for the semaphore behind `limits`, `time` for the egress stall clock.
tokio = { version = "1", default-features = false, features = ["sync", "time"] }
# Lock-free read path for `registry` — slots are read on every inbound frame.
arc-swap = "1"

[dev-dependencies]
# `test-util` = `start_paused` / `time::advance`, so the clocks are tested against a virtual clock
# instead of real sleeps. Tests only; nothing in `src/` calls `pause()`.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "test-util"] }
